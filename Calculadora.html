<html>

<head>
    <title>Calculadora</title>
    <script>
        //CANCULADORA 
        function somar() {
            const valor = parseInt(document.getElementById("num1").value) + parseInt(document.getElementById("num2").value);
            document.getElementById("resultado").innerHTML =
                "Soma igual a: " + valor;
        }
        function subtrair() {
            const valor = parseInt(document.getElementById("num1").value) - parseInt(document.getElementById("num2").value);
            document.getElementById("resultado").innerHTML =
                "Subtracao igual a: " + valor;
        }
        function multiplicar() {
            const valor = parseInt(document.getElementById("num1").value) * parseInt(document.getElementById("num2").value);
            document.getElementById("resultado").innerHTML =
                "Multiplicacao igual a: " + valor;
        }
        function dividir() {
            const valor = parseInt(document.getElementById("num1").value) / parseInt(document.getElementById("num2").value);
            document.getElementById("resultado").innerHTML =
                "Divisao igual a: " + valor;
        } 
        //TESTE MANUAL DA CALCULADORA, VALIDANDO AS FUNÇÕES
        function testeSoma() {
            const num1 = 7;
            const num2 = 3;

            const valor = num1 + num2;
            if (valor !== 10) {
            document.getElementById("teste").innerHTML = "Esperado 10"; 
            } else {
            document.getElementById("teste").innerHTML = "Valor exatamente com o esperado, 10";    
            }
        }
        function testeSubtracao() {
            const num1 = 8;
            const num2 = 3;

            const valor = num1 - num2;
            if (valor !== 5) {
            document.getElementById("teste").innerHTML = "Esperado 5"; 
            } else {
            document.getElementById("teste").innerHTML = "Valor exatamente com o esperado, 5";    
            }
        }
        function testeMultiplicar() {
            const num1 = 8;
            const num2 = 3;

            const valor = num1 * num2;
            if (valor !== 24) {
            document.getElementById("teste").innerHTML = "Esperado 24"; 
            } else {
            document.getElementById("teste").innerHTML = "Valor exatamente com o esperado, 24";    
            }
        }
        function testeDividir() {
            const num1 = 6;
            const num2 = 3;

            const valor = num1 / num2;
            if (valor !== 2) {
            document.getElementById("teste").innerHTML = "Esperado 2"; 
            } else {
            document.getElementById("teste").innerHTML = "Valor exatamente com o esperado, 2";    
            }
        }
        // TENTE DO COMPONENTE INPUT2
        function input2() {
            const meuinput = document.getElementById('num2');
            if (meuinput) {
                document.getElementById('resultado').innerHTML = "O input existe.";
            } else {
               document.getElementById('resultado').innerHTML = "O input não existe.";  
            };
        }
        // TENTE DO COMPONENTE BOTAO SOMAR
        function botaosomar() {
            const botao = document.getElementById('1Botao');
            if (botao) {
                document.getElementById('resultado').innerHTML = "O botao existe.";
            } else {
               document.getElementById('resultado').innerHTML = "O botao não existe."; 
            }
        }
    </script>
</head>

<body>
    <input id="num1" type="number" placeholder="Numero 1">
    <input id="num2" type="number" placeholder="Numero 2">

    <button id="1Botao" onclick="somar()">Somar</button> <button id="2Botao" onclick="subtrair()">Subtrair</button>
    <button id="3Botao" onclick="multiplicar()">Multiplicar</button> <button id="4Botao" onclick="dividir()">Dividir</button>
    <button id="5Botao" onclick="testeSoma()">Teste Soma</button><button id="6Botao" onclick="testeSubtracao()">Teste Substracao</button>
    <button id="7Botao" onclick="testeMultiplicar()">Teste Multiplicacao</button><button id="8Botao" onclick="testeDividir()">Teste Divisao</button>
    <button id="9Botao" onclick="input2()">Teste Input</button><button id="10Botao" onclick="botaosomar()">Teste Botao</button>

    <h1 id="resultado">O resultado aparecerá aqui</h1>
    <h2 id="teste">Esperando teste</h2>

</body>

</html>
